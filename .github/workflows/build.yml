name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar workload de Android
        working-directory: src/FnrPort.Android
        run: dotnet --version && dotnet workload install android

      - name: Comprobar que el backend compila (escritorio)
        run: dotnet build src/FnrPort.Desktop -c Release

      - name: Restaurar
        working-directory: src/FnrPort.Android
        run: dotnet restore -r android-arm64

      - name: Copiar fachadas de .NET Framework (mscorlib, System...) como assets
        run: |
          set -e
          dir=$(find "$HOME/.nuget/packages" "$DOTNET_ROOT/packs" -ipath "*runtime.mono.android-arm64*" -name mscorlib.dll 2>/dev/null | grep "/net10.0/" | head -1 | xargs dirname)
          echo "Runtime pack: $dir"
          test -n "$dir"
          for f in mscorlib System System.Core System.Xml System.Drawing System.Data System.Numerics System.Runtime.Serialization System.Xml.Linq netstandard; do
            if [ -f "$dir/$f.dll" ]; then cp "$dir/$f.dll" src/FnrPort.Android/Assets/facades/; fi
          done
          ls -la src/FnrPort.Android/Assets/facades/

      - name: Compilar APK
        env:
          FNR_KEYSTORE_B64: ${{ secrets.FNR_KEYSTORE_B64 }}
          FNR_KEYSTORE_PASS: ${{ secrets.FNR_KEYSTORE_PASS }}
        run: |
          set -e
          extra=""
          # Firma propia opcional (secretos del repo). Sin ellos se firma con la clave de depuración.
          if [ -n "$FNR_KEYSTORE_B64" ] && [ -n "$FNR_KEYSTORE_PASS" ]; then
            echo "$FNR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fnr.keystore"
            extra="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/fnr.keystore -p:AndroidSigningKeyAlias=fnr -p:AndroidSigningKeyPass=env:FNR_KEYSTORE_PASS -p:AndroidSigningStorePass=env:FNR_KEYSTORE_PASS"
          fi
          cd src/FnrPort.Android && dotnet build -c Release -r android-arm64 --no-restore $extra

      - name: Revisar la APK
        run: |
          set -e
          apk=$(find src/FnrPort.Android/bin/Release -name "*-Signed.apk" | head -1)
          echo "APK: $apk"
          unzip -l "$apk" > contenido.txt
          grep -i "facades/" contenido.txt
          if grep -i "FIGHT_N_RAGE" contenido.txt; then echo "ERROR: el ensamblado de referencia se ha colado en la APK"; exit 1; fi
          grep -c "\.dll" contenido.txt
          mkdir -p salida
          cp "$apk" "salida/FightNRage-Android-$(git rev-parse --short HEAD).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FightNRage-Android
          path: salida/*.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          tag="v0.1.${{ github.run_number }}"
          apk=$(ls salida/*.apk | head -1)
          cp "$apk" "salida/FightNRage-Android-$tag.apk"
          {
            echo "Compilación automática del commit ${GITHUB_SHA::7}."
            echo
            echo "${COMMIT_MSG:-Compilación manual}" | grep -v "^Co-Authored-By\|^Claude-Session"
            echo
            echo "Necesitas tu copia del juego de PC (GOG o Steam): la carpeta con FIGHT_N_RAGE.exe y data."
          } > notas.md
          gh release create "$tag" "salida/FightNRage-Android-$tag.apk" --title "Fight'N Rage Android $tag" --notes-file notas.md --latest
